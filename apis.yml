name: igloo
description: 'Igloo is a full-stack insurtech firm headquartered in Singapore and operating across six
  Southeast Asian markets (Singapore, Indonesia, the Philippines, Thailand, Malaysia, and Vietnam). It
  makes insurance simple, accessible, and affordable by embedding coverage into the platforms consumers
  already use, working with 100+ partners across e-commerce, telecommunications, banking, logistics, and
  lifestyle (including Shopee, Foodpanda, GCash, AIS, and Siam Commercial Bank). Its product line spans
  motor, mobile phone, travel, pet, personal accident, cyber, loan protection, e-commerce purchase protection,
  and blockchain-powered weather-index insurance. Igloo also ships technology platforms for the insurance
  value chain: Igloo Agent (agency management), Igloo Consumer (direct-to-consumer marketplace), Igloo Partner
  (affinity distribution), Ignite (digital agent platform), and the Turbo Core insurance operations system.
  Integration is offered through a partner-facing API program rather than a public self-serve developer portal.'
